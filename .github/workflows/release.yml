name: Build and Release

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: ''
      release_type:
        description: 'Release type (overrides branch detection)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - beta
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      git_sha: ${{ steps.version.outputs.git_sha }}
      build_type: ${{ steps.version.outputs.build_type }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          # Get Git short SHA
          GIT_SHA=$(git rev-parse --short HEAD)
          
          # Build number from GitHub run number
          BUILD_NUMBER="${{ github.run_number }}"
          
          # Determine build type based on branch or manual input
          MANUAL_TYPE="${{ github.event.inputs.release_type }}"
          
          if [ -n "$MANUAL_TYPE" ]; then
            # Use manual input if provided
            if [ "$MANUAL_TYPE" = "release" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: determine by target branch
            if [ "${{ github.base_ref }}" = "main" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          else
            # Push: determine by branch
            if [ "${{ github.ref_name }}" = "main" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          fi
          
          # Get version from input or auto-increment
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            # Get latest tag and increment patch
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION_NAME="${LATEST_TAG#v}"
            IFS='.' read -ra VERSION_PARTS <<< "$VERSION_NAME"
            MAJOR="${VERSION_PARTS[0]:-0}"
            MINOR="${VERSION_PARTS[1]:-0}"
            PATCH="${VERSION_PARTS[2]:-0}"
            PATCH=$((PATCH + 1))
            VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          fi
          
          # Full version: version.<type><build>-<sha>
          FULL_VERSION="$VERSION_NAME.$BUILD_TYPE$BUILD_NUMBER-$GIT_SHA"
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          
          TYPE_DISPLAY="beta"
          if [ "$BUILD_TYPE" = "r" ]; then
            TYPE_DISPLAY="release"
          fi
          
          echo "========================================"
          echo "Version: $VERSION_NAME"
          echo "Type: $BUILD_TYPE ($TYPE_DISPLAY)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Build: $BUILD_NUMBER"
          echo "Git SHA: $GIT_SHA"
          echo "Full: $FULL_VERSION"
          echo "========================================"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > app/keystore.jks
          fi

      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Release Bundle
        if: github.event_name != 'pull_request' && github.event.inputs.version_name != '' && steps.version.outputs.build_type == 'r'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Rename APK with version
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.version.outputs.full_version }}"
          find app/build/outputs/apk/release -name "*.apk" -exec mv {} app/build/outputs/apk/release/revive-$VERSION.apk \;

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: revive-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: revive-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Bundle
        if: github.event_name != 'pull_request' && github.event.inputs.version_name != '' && steps.version.outputs.build_type == 'r'
        uses: actions/upload-artifact@v4
        with:
          name: revive-bundle-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/bundle/release/*.aab

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version_name != '' && needs.build.outputs.build_type == 'r'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: revive-${{ needs.build.outputs.full_version }}
          path: ./artifacts

      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: revive-bundle-${{ needs.build.outputs.full_version }}
          path: ./bundle
        continue-on-error: true

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.build.outputs.version_name }}" -m "Release ${{ needs.build.outputs.full_version }}"
          git push origin "v${{ needs.build.outputs.version_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: Revive ${{ needs.build.outputs.full_version }}
          body: |
            ## Revive ${{ needs.build.outputs.full_version }}
            
            | Property | Value |
            |----------|-------|
            | Version | `${{ needs.build.outputs.version_name }}` |
            | Type | Release |
            | Build | `${{ needs.build.outputs.build_number }}` |
            | Commit | `${{ needs.build.outputs.git_sha }}` |
            
            ### Downloads
            - **APK**: Download and install directly on your Android device
            - **AAB**: For Google Play Store distribution
            
            ### Changelog
            See commit history for changes in this version.
          files: |
            ./artifacts/*.apk
            ./bundle/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}