name: Build and Release

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: ''
      release_type:
        description: 'Release type (overrides branch detection)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - beta
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      git_sha: ${{ steps.version.outputs.git_sha }}
      build_type: ${{ steps.version.outputs.build_type }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          # Get Git short SHA
          GIT_SHA=$(git rev-parse --short HEAD)
          
          # Build number from GitHub run number
          BUILD_NUMBER="${{ github.run_number }}"
          
          # Determine build type based on branch or manual input
          MANUAL_TYPE="${{ github.event.inputs.release_type }}"
          
          if [ -n "$MANUAL_TYPE" ]; then
            if [ "$MANUAL_TYPE" = "release" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.base_ref }}" = "main" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          else
            if [ "${{ github.ref_name }}" = "main" ]; then
              BUILD_TYPE="r"
            else
              BUILD_TYPE="b"
            fi
          fi
          
          # Get version from input or auto-increment with 0.1.x format
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            VERSION_NAME="${LATEST_TAG#v}"
            # Remove any suffix like -beta
            VERSION_NAME="${VERSION_NAME%-*}"
            IFS='.' read -ra VERSION_PARTS <<< "$VERSION_NAME"
            MAJOR="${VERSION_PARTS[0]:-0}"
            MINOR="${VERSION_PARTS[1]:-1}"
            # Auto-increment build number (x in 0.1.x)
            BUILD_NUM="${VERSION_PARTS[2]:-0}"
            BUILD_NUM=$((BUILD_NUM + 1))
            VERSION_NAME="$MAJOR.$MINOR.$BUILD_NUM"
          fi
          
          FULL_VERSION="$VERSION_NAME.$BUILD_TYPE$BUILD_NUMBER-$GIT_SHA"
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          
          echo "Version: $FULL_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          gradle-home-cache-cleanup: true

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > app/keystore.jks
          fi

      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        run: gradle assembleDebug

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build Release Bundle
        if: github.event_name != 'pull_request' && github.event.inputs.version_name != '' && steps.version.outputs.build_type == 'r'
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_RUN_NUMBER: ${{ steps.version.outputs.build_number }}
          GIT_SHA: ${{ steps.version.outputs.git_sha }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          KEYSTORE_PATH: app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Rename APK with version
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.version.outputs.full_version }}"
          find app/build/outputs/apk/release -name "*.apk" -exec mv {} app/build/outputs/apk/release/revive-$VERSION.apk \;

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: revive-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: revive-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Bundle
        if: github.event_name != 'pull_request' && github.event.inputs.version_name != '' && steps.version.outputs.build_type == 'r'
        uses: actions/upload-artifact@v4
        with:
          name: revive-bundle-${{ steps.version.outputs.full_version }}
          path: app/build/outputs/bundle/release/*.aab

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: revive-${{ needs.build.outputs.full_version }}
          path: ./artifacts

      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: revive-bundle-${{ needs.build.outputs.full_version }}
          path: ./bundle
        continue-on-error: true

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version_name }}"
          FULL_VERSION="${{ needs.build.outputs.full_version }}"
          BUILD_NUM="${{ needs.build.outputs.build_number }}"
          GIT_SHA="${{ needs.build.outputs.git_sha }}"
          BUILD_TYPE="${{ needs.build.outputs.build_type }}"
          
          # Determine release type string
          if [ "$BUILD_TYPE" = "r" ]; then
            RELEASE_TYPE="Release"
          else
            RELEASE_TYPE="Beta"
          fi
          
          # Start building changelog
          cat > /tmp/changelog.md << EOF
          ## Revive ${FULL_VERSION}
          
          | Property | Value |
          |----------|-------|
          | Version | \`${VERSION}\` |
          | Type | ${RELEASE_TYPE} |
          | Build | \`${BUILD_NUM}\` |
          | Commit | \`${GIT_SHA}\` |
          
          ---
          
          EOF
          
          # Try to find previous tag, fallback to last release commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          
          # If no tag found, try to get commits since last release workflow run
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, fetching recent commits..."
            
            # Get last 10 commits (or use a reasonable default)
            COMMITS=$(git log -10 --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "")
            
            if [ -n "$COMMITS" ]; then
              # Categorize commits from recent history
              FEATURES=$(echo "$COMMITS" | grep -iE "feat|feature|add" || true)
              FIXES=$(echo "$COMMITS" | grep -iE "fix|bug|hotfix" || true)
              IMPROVEMENTS=$(echo "$COMMITS" | grep -iE "improve|update|refactor|optimize|perf|enhance" || true)
              OTHER=$(echo "$COMMITS" | grep -ivE "feat|feature|add|fix|bug|hotfix|improve|update|refactor|optimize|perf|enhance" || true)
              
              if [ -n "$FEATURES" ]; then
                echo "### 新功能 Features" >> /tmp/changelog.md
                echo "$FEATURES" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$FIXES" ]; then
                echo "### 修复 Bug Fixes" >> /tmp/changelog.md
                echo "$FIXES" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$IMPROVEMENTS" ]; then
                echo "### 改进 Improvements" >> /tmp/changelog.md
                echo "$IMPROVEMENTS" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$OTHER" ]; then
                echo "### 其他 Other" >> /tmp/changelog.md
                echo "$OTHER" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
            else
              echo "### 更新 Updates" >> /tmp/changelog.md
              echo "- Automated build deployment" >> /tmp/changelog.md
              echo "" >> /tmp/changelog.md
            fi
          else
            echo "Found previous tag: $PREV_TAG"
            
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "")
            
            if [ -n "$COMMITS" ]; then
              # Categorize commits
              FEATURES=$(echo "$COMMITS" | grep -iE "feat|feature|add" || true)
              FIXES=$(echo "$COMMITS" | grep -iE "fix|bug|hotfix" || true)
              IMPROVEMENTS=$(echo "$COMMITS" | grep -iE "improve|update|refactor|optimize|perf|enhance" || true)
              OTHER=$(echo "$COMMITS" | grep -ivE "feat|feature|add|fix|bug|hotfix|improve|update|refactor|optimize|perf|enhance" || true)
              
              if [ -n "$FEATURES" ]; then
                echo "### 新功能 Features" >> /tmp/changelog.md
                echo "$FEATURES" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$FIXES" ]; then
                echo "### 修复 Bug Fixes" >> /tmp/changelog.md
                echo "$FIXES" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$IMPROVEMENTS" ]; then
                echo "### 改进 Improvements" >> /tmp/changelog.md
                echo "$IMPROVEMENTS" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
              if [ -n "$OTHER" ]; then
                echo "### 其他 Other" >> /tmp/changelog.md
                echo "$OTHER" >> /tmp/changelog.md
                echo "" >> /tmp/changelog.md
              fi
            else
              echo "### 更新 Updates" >> /tmp/changelog.md
              echo "- No significant changes since last release" >> /tmp/changelog.md
              echo "" >> /tmp/changelog.md
            fi
          fi
          
          # Add download section
          cat >> /tmp/changelog.md << EOF
          
          ---
          
          ### Downloads
          | File | Description |
          |------|-------------|
          | APK | Install directly on Android device |
          | AAB | For Google Play Store distribution |
          EOF
          
          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add beta suffix for beta builds
          BUILD_TYPE="${{ needs.build.outputs.build_type }}"
          VERSION="${{ needs.build.outputs.version_name }}"
          
          if [ "$BUILD_TYPE" = "b" ]; then
            TAG_NAME="v${VERSION}-beta"
          else
            TAG_NAME="v${VERSION}"
          fi
          
          git tag -a "$TAG_NAME" -m "Release ${{ needs.build.outputs.full_version }}"
          git push origin "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version_name }}${{ needs.build.outputs.build_type == 'b' && '-beta' || '' }}
          name: Revive ${{ needs.build.outputs.full_version }}
          body_path: /tmp/changelog.md
          files: |
            ./artifacts/*.apk
            ./bundle/*.aab
          draft: false
          prerelease: ${{ needs.build.outputs.build_type == 'b' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
